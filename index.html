<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Not Detective — Say the Negative!</title><meta name="theme-color" content="#7c3aed"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Not Detective"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui,sans-serif;background:#f5f3ff;color:#2e1065;margin:0;padding:20px;text-align:center}h1{font-size:30px}.card{background:#fff;border-radius:24px;max-width:560px;margin:20px auto;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.pic{font-size:100px}.wrong{font-size:22px;color:#dc2626;font-weight:700}.ans{font-size:26px;font-weight:800;color:#059669}button{font-size:20px;padding:12px 20px;border:0;border-radius:14px;background:#7c3aed;color:#fff;margin:6px;cursor:pointer}button.alt{background:#ede9fe;color:#2e1065}.small{color:#6b7280}</style></head><body><h1>🔍 Not Detective</h1><p>Fresh negatives game! The sentence is WRONG. Spot it, then <b>say the NOT sentence</b> out loud.</p><div class="card"><div class="pic" id="pic"></div><div class="wrong" id="wrong"></div><div id="prompt">Is that right? Nope! Say the correct NOT sentence:</div><div class="ans" id="ans" style="display:none"></div></div><div><button onclick="reveal()">👀 Show the NOT sentence</button><button onclick="hear()">🔊 Hear it</button></div><div><button class="alt" onclick="claimed()">🗣️ I said it!</button> <button class="alt" onclick="next()">Next case ➜</button></div><p class="small" id="score"></p><p class="small">For Jonathan — puzzles + detective thinking + saying negatives, not just matching. Save like an app: Safari → Share → Add to Home Screen.</p><script>const R=[["He is sleeping", "He is eating", "\ud83c\udf7d\ufe0f", "He is NOT sleeping, he is eating!"], ["She is running", "She is sitting", "\ud83e\ude91", "She is NOT running, she is sitting!"], ["The cat is swimming", "The cat is sleeping", "\ud83d\ude34", "The cat is NOT swimming, it is sleeping!"], ["He is crying", "He is laughing", "\ud83d\ude02", "He is NOT crying, he is laughing!"], ["She is reading", "She is dancing", "\ud83d\udc83", "She is NOT reading, she is dancing!"], ["The dog is barking", "The dog is sleeping", "\ud83d\udc36", "The dog is NOT barking, it is sleeping!"], ["He is jumping", "He is sitting", "\ud83e\uddcd", "He is NOT jumping, he is sitting!"], ["She is eating an apple", "She is eating a banana", "\ud83c\udf4c", "She is NOT eating an apple, she is eating a banana!"], ["It is raining", "It is sunny", "\u2600\ufe0f", "It is NOT raining, it is sunny!"], ["He is sad", "He is happy", "\ud83d\ude0a", "He is NOT sad, he is happy!"]];let i=0,score=0;function render(){document.getElementById('pic').textContent=R[i][2];document.getElementById('wrong').textContent='❌ "'+R[i][0]+'"';document.getElementById('ans').style.display='none';document.getElementById('ans').textContent='✅ '+R[i][3];document.getElementById('score').textContent='Cases solved: '+score+' ⭐ | Case '+(i+1)+' of '+R.length}function reveal(){document.getElementById('ans').style.display='block'}function hear(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(R[i][3]))}catch(e){}}function claimed(){score++;render()}function next(){i=(i+1)%R.length;render()}render();</script></body></html>
