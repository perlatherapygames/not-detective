<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Not Detective — Pick the NOT Sentence!</title><meta name="theme-color" content="#7c3aed"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Not Detective"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui,sans-serif;background:#f5f3ff;color:#2e1065;margin:0;padding:20px;text-align:center}h1{font-size:30px}.card{background:#fff;border-radius:24px;max-width:600px;margin:20px auto;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.pic{font-size:100px}.prompt{font-size:22px;line-height:1.5}button.opt{display:block;width:100%;font-size:20px;padding:16px;border:0;border-radius:16px;background:#ede9fe;color:#2e1065;margin:10px 0;cursor:pointer;text-align:left}button.opt:hover{background:#ddd6fe}button{font-size:20px;padding:12px 20px;border:0;border-radius:14px;background:#7c3aed;color:#fff;margin:6px;cursor:pointer}button.alt{background:#ede9fe;color:#2e1065}.small{color:#6b7280}#fb{font-size:22px;min-height:32px;font-weight:700}</style></head><body><h1>🔍 Not Detective</h1><p>Pick the sentence that says <b>NOT</b> and is true — then say it out loud to earn your points!</p><div class="card"><div class="pic" id="pic"></div><div class="prompt" id="prompt"></div><div id="opts"></div><div id="fb"></div></div><div><button class="alt" onclick="hear()">🔊 Hear the choices</button> <button class="alt" onclick="next()">Next case ➜</button></div><p class="small" id="score"></p><p class="small">Points only for picking the correct NOT sentence. Say it out loud after you pick it! Save like an app: Safari → Share → Add to Home Screen.</p><script>const R=[["\ud83c\udf7d\ufe0f", "A boy is eating. Pick the sentence that says NOT and is true.", ["He is sleeping.", "He is NOT sleeping, he is eating!", "He is NOT eating, he is sleeping!"], 1], ["\ud83e\ude91", "A girl is sitting. Pick the sentence that says NOT and is true.", ["She is NOT sitting, she is running!", "She is running.", "She is NOT running, she is sitting!"], 2], ["\ud83d\ude34", "A cat is sleeping. Pick the sentence that says NOT and is true.", ["The cat is swimming.", "The cat is NOT swimming, it is sleeping!", "The cat is NOT sleeping, it is swimming!"], 1], ["\ud83d\ude02", "A boy is laughing. Pick the sentence that says NOT and is true.", ["He is NOT laughing, he is crying!", "He is crying.", "He is NOT crying, he is laughing!"], 2], ["\ud83d\udc83", "A girl is dancing. Pick the sentence that says NOT and is true.", ["She is reading.", "She is NOT dancing, she is reading!", "She is NOT reading, she is dancing!"], 2], ["\ud83d\udc36", "A dog is sleeping. Pick the sentence that says NOT and is true.", ["The dog is NOT sleeping, it is barking!", "The dog is NOT barking, it is sleeping!", "The dog is barking."], 1], ["\ud83e\uddcd", "A boy is sitting. Pick the sentence that says NOT and is true.", ["He is jumping.", "He is NOT sitting, he is jumping!", "He is NOT jumping, he is sitting!"], 2], ["\ud83c\udf4c", "A girl is eating a banana. Pick the sentence that says NOT and is true.", ["She is NOT eating a banana, she is eating an apple!", "She is eating an apple.", "She is NOT eating an apple, she is eating a banana!"], 2], ["\u2600\ufe0f", "It is sunny. Pick the sentence that says NOT and is true.", ["It is NOT sunny, it is raining!", "It is raining.", "It is NOT raining, it is sunny!"], 2], ["\ud83d\ude0a", "A boy is happy. Pick the sentence that says NOT and is true.", ["He is sad.", "He is NOT happy, he is sad!", "He is NOT sad, he is happy!"], 2], ["\ud83d\udcd6", "A girl is reading. Pick the sentence that says NOT and is true.", ["She is NOT reading, she is swimming!", "She is swimming.", "She is NOT swimming, she is reading!"], 2], ["\u26bd", "A boy is playing soccer. Pick the sentence that says NOT and is true.", ["He is NOT playing soccer, he is sleeping!", "He is sleeping.", "He is NOT sleeping, he is playing soccer!"], 2]];let i=0,score=0,locked=false;function render(){document.getElementById('pic').textContent=R[i][0];document.getElementById('prompt').textContent=R[i][1];document.getElementById('fb').textContent='';locked=false;let o=document.getElementById('opts');o.innerHTML='';R[i][2].forEach((t,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(j,b);o.appendChild(b)});document.getElementById('score').textContent='Score: '+score+' ⭐ | Case '+(i+1)+' of '+R.length}function pick(j,b){if(locked)return;if(j===R[i][3]){locked=true;score+=10;document.getElementById('fb').textContent='✅ Correct! +10 points! Now say it out loud: '+R[i][2][j];b.style.background='#bbf7d0'}else{document.getElementById('fb').textContent='Try again — that one is not the true NOT sentence.';b.style.background='#fecaca'}document.getElementById('score').textContent='Score: '+score+' ⭐ | Case '+(i+1)+' of '+R.length}function hear(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(R[i][1]+' '+R[i][2].join('. ')))}catch(e){}}function next(){i=(i+1)%R.length;render()}render();</script></body></html>
